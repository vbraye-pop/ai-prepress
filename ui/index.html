<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ai-prepress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="image-import.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark">AP</span>
      <b>ai-prepress</b>
    </div>
    <nav class="pill-tabs" id="view-tabs">
      <button class="pill-tab" data-view="inspect" data-active="true">Inspect</button>
      <button class="pill-tab" data-view="match-look" data-active="false">Match Look</button>
    </nav>
  </header>

  <main>
    <section id="view-inspect" class="view active">
      <div class="workspace">
        <div id="inspect-import-mount" class="viewport-slot"></div>
        <aside class="inspector-panel">
          <div class="inspector-head">
            <span class="t-eyebrow">Stats</span>
          </div>
          <p id="inspect-placeholder" class="t-caption">Import an image to see its stats.</p>
          <dl id="inspect-report" class="stat-list" hidden></dl>
          <div id="exif-block" hidden>
            <div class="divider"></div>
            <span class="t-eyebrow">EXIF</span>
            <dl id="exif-report" class="stat-list"></dl>
          </div>
          <div id="raw-tags-block" hidden>
            <div class="divider"></div>
            <span class="t-eyebrow">Raw tags</span>
            <dl id="raw-tags-report" class="stat-list"></dl>
          </div>
        </aside>
      </div>
    </section>

    <section id="view-match-look" class="view">
      <div class="container-narrow">
        <form id="match-form" class="card">
          <div class="field-row">
            <div class="importer-slot">
              <span class="t-eyebrow">Target</span>
              <div id="target-import-mount" class="importer-box"></div>
            </div>
            <div class="importer-slot">
              <span class="t-eyebrow">Reference</span>
              <div id="reference-import-mount" class="importer-box"></div>
            </div>
          </div>
          <label>Method
            <select class="input" id="method">
              <option value="mkl">MKL (full covariance)</option>
              <option value="reinhard">Reinhard (mean/std)</option>
            </select>
          </label>
          <button type="submit" class="btn btn-primary" id="match-submit" disabled>Run match look</button>
        </form>

        <div id="match-status" class="status"></div>

        <div id="match-output" class="card" hidden>
          <figure class="result-figure">
            <img id="result-preview" alt="result" />
            <figcaption class="t-caption">result</figcaption>
          </figure>
          <dl id="match-report" class="stat-list"></dl>
          <a id="match-download" class="btn btn-secondary" href="#">Download full-precision TIFF</a>
        </div>
      </div>
    </section>
  </main>

  <script src="image-import.js"></script>
  <script src="app.js"></script>
</body>
</html>
