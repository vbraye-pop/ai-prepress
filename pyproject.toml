[project]
name = "ai-prepress"
version = "0.1.0"
description = "AI-assisted prepress toolkit: masking, color matching, cropping, retouching, dust removal, background replacement"
authors = [
    { name = "vbraye-pop", email = "valerien.braye@proseonpixels.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "tifffile>=2025.1.1",
    "pillow>=11.0",
    "colour-science>=0.4.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "huggingface-hub>=0.26",
    "httpx>=0.27",
    # pinned below 1.0 - mediapipe 1.0.x hard-crashes on macOS/arm64 for any Tasks graph with a
    # detector calculator (TensorsToDetectionsCalculator inits Metal unconditionally and aborts
    # when the graph never registers a Metal service, even with delegate=CPU explicitly set)
    "mediapipe==0.10.35",
    # already resolved transitively via mediapipe's own dependency on it - declared directly too
    # since alpha_refine.py imports cv2.ximgproc, which mediapipe doesn't re-export. Deliberately
    # opencv-contrib-python, not opencv-python: the two ship the same cv2 package and conflict if
    # both land in one environment, and mediapipe already pulls in the contrib build
    "opencv-contrib-python>=4.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
deploy = [
    "modal>=1.5",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"
